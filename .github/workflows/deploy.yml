name: Deploy Aphelion Run

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Require deploy role
        if: vars.AWS_DEPLOY_ROLE_ARN == ''
        run: |
          echo 'AWS_DEPLOY_ROLE_ARN is not configured for environment production.'
          exit 1

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || 'us-east-1' }}

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm test

      - name: Build the site
        run: npm run build

      - name: Require site export
        run: |
          if [ ! -f packages/www/out/index.html ]; then
            echo 'packages/www/out/index.html is missing before site deploy.'
            exit 1
          fi

      - name: Deploy AphelionSite-prod
        working-directory: packages/infra
        run: >
          npx cdk deploy AphelionSite-prod
          --require-approval never
          --toolkit-stack-name AphelionToolkit
          --context @aws-cdk/core:bootstrapQualifier=aphln

      - name: Verify apex
        run: |
          for attempt in $(seq 1 12); do
            code="$(curl -sS -o /dev/null -w '%{http_code}' --max-time 20 https://aphelionrun.com/ || true)"
            if [ "$code" = "200" ]; then
              exit 0
            fi
            if [ "$attempt" -lt 12 ]; then
              sleep 10
            fi
          done
          echo 'https://aphelionrun.com/ did not return HTTP 200'
          exit 1
